    (function (l) {

    // Apply the saved theme before first paint so dark-mode visitors don't see a light flash.
    try {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark');
    } catch (e) {}
  </script>
